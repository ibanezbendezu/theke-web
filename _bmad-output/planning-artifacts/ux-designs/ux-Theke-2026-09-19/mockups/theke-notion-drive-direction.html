<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Theke · dirección visual</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      --page: #191919;
      --sidebar: #202020;
      --text: #ededed;
      --muted: #a5a5a5;
      --subtle: #929292;
      --hover: rgb(255 255 255 / 6%);
      --active: rgb(255 255 255 / 9%);
      --surface: rgb(255 255 255 / 4%);
      --focus: #7ab4ff;
      --gutter: 32px;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--page); color: var(--text); }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
    a { color: inherit; text-decoration: none; }

    .app { display: flex; min-height: 100vh; }
    .sidebar {
      display: flex;
      flex-direction: column;
      flex: none;
      width: 272px;
      min-height: 100vh;
      padding: 16px 12px 12px;
      background: var(--sidebar);
    }
    .sidebar-top { display: flex; align-items: center; justify-content: space-between; padding: 0 9px; margin-bottom: 24px; }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 650; }
    .brand-mark { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 5px; background: var(--active); }
    .icon-button { display: grid; place-items: center; width: 32px; height: 32px; padding: 0; border: 0; border-radius: 6px; background: transparent; color: var(--muted); }
    .icon-button:hover { background: var(--hover); color: var(--text); }
    .nav { display: grid; gap: 3px; }
    .nav a { display: flex; align-items: center; gap: 11px; min-height: 35px; padding: 5px 10px; border-radius: 6px; color: #bcbcbc; font-size: 14px; }
    .nav a:hover, .nav a.active { background: var(--active); color: var(--text); }
    .nav .symbol { width: 19px; color: var(--muted); text-align: center; font-size: 16px; }
    .side-section { margin-top: 28px; padding: 0 10px; }
    .side-section h2 { margin: 0 0 9px; color: var(--subtle); font-size: 12px; font-weight: 600; }
    .side-section a { display: block; overflow: hidden; padding: 5px 0; color: var(--muted); text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
    .side-section a:hover { color: var(--text); }
    .sidebar-spacer { flex: 1; min-height: 32px; }
    .sidebar-search { display: flex; align-items: center; gap: 9px; width: 100%; min-height: 36px; padding: 0 10px; border: 0; border-radius: 6px; background: var(--surface); color: var(--muted); text-align: left; font-size: 13px; }
    .sidebar-search:hover { background: var(--active); color: var(--text); }
    .sidebar-search kbd { margin-left: auto; color: var(--subtle); font: inherit; font-size: 11px; }
    .account { display: flex; align-items: center; gap: 9px; min-height: 46px; padding: 8px 9px 0; color: #cfcfcf; font-size: 13px; }
    .avatar { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 6px; background: var(--active); font-weight: 600; }

    .main { flex: 1; min-width: 0; }
    .mobile-bar { display: none; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 20px; height: 46px; padding: 0 22px; background: rgb(0 0 0 / 5%); font-size: 13px; }
    .topbar-path { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .crumb { color: var(--subtle); }
    .topbar-actions { display: flex; align-items: center; gap: 14px; white-space: nowrap; }
    .topbar-meta { color: var(--subtle); }
    .topbar-action { width: 30px; height: 30px; padding: 0; border: 0; border-radius: 6px; background: transparent; color: var(--muted); font-size: 19px; }
    .topbar-action:hover { background: var(--hover); color: var(--text); }

    .view { display: none; min-height: calc(100vh - 46px); padding: 28px var(--gutter) 64px; }
    .view.active { display: block; }
    .collection-toolbar { display: flex; align-items: center; gap: 12px; min-height: 38px; margin-bottom: 24px; }
    .groups { display: flex; align-items: center; flex-wrap: wrap; gap: 3px; min-width: 0; }
    .group-button { min-height: 34px; padding: 0 12px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); white-space: nowrap; font-size: 13px; font-weight: 500; }
    .group-button:hover, .group-button.active { background: var(--active); color: var(--text); }
    .toolbar-spacer { flex: 1; }
    .search-field { display: flex; align-items: center; gap: 9px; flex: 0 1 330px; height: 35px; padding: 0 11px; border-radius: 6px; background: var(--surface); color: var(--muted); }
    .search-field:focus-within { background: var(--active); outline: 2px solid var(--focus); outline-offset: 2px; }
    .search-field input { width: 100%; min-width: 0; padding: 0; border: 0; outline: 0; background: transparent; color: var(--text); font-size: 13px; }
    .search-field input::placeholder { color: var(--muted); }
    .collection-actions { display: flex; align-items: center; flex: none; gap: 3px; }
    .view-toggle { display: flex; align-items: center; gap: 2px; }
    .view-toggle button, .create-button { display: grid; place-items: center; width: 35px; height: 35px; padding: 0; border: 0; border-radius: 6px; background: transparent; color: var(--muted); font-size: 17px; }
    .view-toggle button:hover, .view-toggle button.active, .create-button:hover, .create-button[aria-expanded="true"] { background: var(--active); color: var(--text); }
    .create-button { margin-left: 4px; font-size: 23px; font-weight: 300; line-height: 1; }
    .create-wrap { position: relative; }
    .create-menu { position: absolute; z-index: 5; top: 40px; right: 0; width: 170px; padding: 5px; border-radius: 8px; background: #292929; box-shadow: 0 10px 30px rgb(0 0 0 / 25%); }
    .create-menu[hidden] { display: none; }
    .create-menu button { display: block; width: 100%; padding: 8px 10px; border: 0; border-radius: 5px; background: transparent; color: var(--text); text-align: left; font-size: 13px; }
    .create-menu button:hover { background: var(--active); }

    .table { width: 100%; border-collapse: collapse; text-align: left; }
    .table th { padding: 10px 12px; border-bottom: 1px solid rgb(255 255 255 / 12%); color: var(--muted); font-size: 12px; font-weight: 500; }
    .table td { padding: 13px 12px; border-bottom: 1px solid rgb(255 255 255 / 7%); font-size: 14px; }
    .table tbody tr:hover td { background: var(--hover); }
    .item-name { font-weight: 600; }
    .item-icon { display: inline-grid; place-items: center; width: 24px; height: 24px; margin-right: 9px; border-radius: 5px; background: var(--active); color: #d7a77d; }
    .muted { color: var(--muted); }
    .project-gallery { display: none; grid-template-columns: repeat(auto-fill, minmax(225px, 1fr)); gap: 12px; }
    .project-tile { min-height: 122px; padding: 16px; border-radius: 8px; background: var(--surface); }
    .project-tile:hover { background: var(--hover); }
    .project-tile strong { display: block; margin-bottom: 12px; font-size: 15px; }
    .project-tile p { margin: 0 0 14px; color: var(--muted); font-size: 13px; }
    .project-tile small { color: var(--subtle); }
    .home.gallery .table { display: none; }
    .home.gallery .project-gallery { display: grid; }

    .sort { margin: 0 0 14px; color: var(--muted); font-size: 12px; }
    .empty { margin: 40px 0; color: var(--muted); font-size: 14px; }
    .resource-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(205px, 1fr)); gap: 15px; }
    .resource-card { min-width: 0; padding: 10px; border: 0; border-radius: 8px; background: var(--surface); color: var(--text); text-align: left; }
    .resource-card:hover { background: var(--hover); }
    .resource-head { display: flex; align-items: center; gap: 9px; height: 34px; padding: 0 3px 8px; font-size: 13px; font-weight: 600; }
    .file-icon { display: grid; place-items: center; width: 20px; height: 20px; border-radius: 4px; background: #9e6662; color: #fff; font-size: 9px; font-weight: 700; }
    .file-icon.note { background: #987d45; }.file-icon.link { background: #45799d; }.file-icon.audio { background: #786496; }.file-icon.image { background: #9e6662; }.file-icon.video { background: #996b48; }
    .resource-head .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .thumb { display: flex; align-items: center; justify-content: center; aspect-ratio: 1.38; overflow: hidden; border-radius: 5px; background: #292929; color: #ddd; }
    .thumb.paper { background: #dededb; color: #272727; }
    .paper-content { width: 72%; height: 88%; padding: 18px 15px; background: #fff; box-shadow: 0 3px 14px rgb(0 0 0 / 20%); }
    .paper-content strong { display: block; margin-bottom: 12px; font-size: 12px; }
    .paper-content i { display: block; height: 5px; margin: 7px 0; background: #dedede; }
    .paper-content i:nth-child(4) { width: 65%; }
    .thumb.diagram { background: #303338; }
    .diagram-content { position: relative; width: 80%; height: 70%; border: 1px solid #686f72; border-radius: 6px; }
    .diagram-content::before, .diagram-content::after { content: ""; position: absolute; width: 32%; height: 22%; border: 1px solid #adb7bd; border-radius: 4px; background: #252a2d; }
    .diagram-content::before { left: 9%; top: 16%; }.diagram-content::after { right: 9%; bottom: 16%; }
    .diagram-line { position: absolute; left: 38%; top: 48%; width: 26%; height: 2px; background: #82aee8; transform: rotate(24deg); }
    .thumb.note-thumb { align-items: flex-start; justify-content: flex-start; padding: 23px; background: #313032; }
    .note-preview { max-width: 92%; font-size: 13px; line-height: 1.55; }
    .note-preview strong { display: block; margin-bottom: 8px; font-size: 15px; }
    .thumb.link-thumb { background: #282e32; color: #9dd3f7; font-size: 38px; }
    .thumb.audio-thumb { background: #312d37; color: #d1b5ec; font-size: 36px; }
    .thumb.video-thumb { background: #322d2a; color: #e7b491; font-size: 40px; }
    .resource-list { display: none; }
    .resource-list .resource-card { display: flex; align-items: center; gap: 14px; width: 100%; margin-bottom: 5px; padding: 7px 10px; }
    .resource-list .resource-head { flex: 1; }
    .resource-list .thumb { width: 56px; height: 42px; aspect-ratio: auto; font-size: 16px; }
    .resource-list .thumb > * { display: none; }
    .library.list .resource-grid { display: none; }.library.list .resource-list { display: block; }

    @media (max-width: 1050px) { .collection-toolbar { flex-wrap: wrap; }.search-field { order: 3; flex: 1 0 100%; }.collection-actions { margin-left: auto; } }
    @media (max-width: 760px) {
      :root { --gutter: 16px; }
      .sidebar { position: fixed; z-index: 20; inset: 0 auto 0 0; box-shadow: 10px 0 28px rgb(0 0 0 / 40%); transform: translateX(-105%); transition: transform .16s ease; }
      .app.sidebar-open .sidebar { transform: translateX(0); }
      .mobile-bar { display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 15px; background: var(--sidebar); }
      .mobile-bar strong { font-size: 15px; }.mobile-bar button { border: 0; background: transparent; color: var(--text); font-size: 20px; }
      .topbar { height: 43px; padding: 0 15px; }.topbar-meta, .topbar-action { display: none; }
      .view { min-height: calc(100vh - 95px); padding-top: 18px; }
      .group-button { padding: 0 9px; }.collection-toolbar { gap: 8px; }
      .table th:nth-child(n+3), .table td:nth-child(n+3) { display: none; }
      .resource-grid { grid-template-columns: repeat(auto-fill, minmax(145px, 1fr)); gap: 10px; }
      .resource-card { padding: 8px; }.resource-head { font-size: 12px; }
    }
    @media (prefers-reduced-motion: reduce) { .sidebar { transition: none; } }
  </style>
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" aria-label="Navegación principal">
      <div class="sidebar-top"><div class="brand"><span class="brand-mark">T</span><span>Theke</span></div><button class="icon-button" type="button" aria-label="Cerrar navegación" onclick="document.getElementById('app').classList.remove('sidebar-open')">◧</button></div>
      <nav class="nav" aria-label="Secciones">
        <a href="#proyectos" id="nav-projects" class="active" onclick="showView('projects')"><span class="symbol">⌂</span>Inicio</a>
        <a href="#library" id="nav-library" onclick="showView('library')"><span class="symbol">▦</span>Biblioteca</a>
        <a href="#proyectos" onclick="showView('projects')"><span class="symbol">▱</span>Proyectos</a>
      </nav>
      <section class="side-section"><h2>Recientes</h2><a href="#proyectos" onclick="showView('projects')">Investigación de ecosistemas</a><a href="#library" onclick="showView('library')">Fuentes del proyecto</a></section>
      <section class="side-section"><h2>Proyectos</h2><a href="#proyectos" onclick="showView('projects')">Atlas de campo</a><a href="#proyectos" onclick="showView('projects')">Historia oral</a></section>
      <div class="sidebar-spacer"></div>
      <div class="account"><span class="avatar">A</span><span>Mi espacio de Theke</span><span style="margin-left:auto">⌄</span></div>
      <button class="sidebar-search" type="button" onclick="showView('library');document.getElementById('library-search-input').focus()"><span aria-hidden="true">⌕</span><span>Buscar o preguntar</span><kbd>Ctrl+K</kbd></button>
    </aside>
    <main class="main">
      <div class="mobile-bar"><button type="button" aria-label="Abrir navegación" onclick="document.getElementById('app').classList.add('sidebar-open')">☰</button><strong>Theke</strong></div>
      <header class="topbar" aria-label="Barra superior"><div class="topbar-path"><span class="crumb">Mi espacio</span><span aria-hidden="true">/</span><span id="topbar-page">Inicio</span></div><div class="topbar-actions"><span class="topbar-meta" id="topbar-meta">Editado hoy</span><button class="topbar-action" type="button" aria-label="Más acciones">⋯</button></div></header>

      <section id="projects" class="view home active" aria-label="Inicio y proyectos">
        <div class="collection-toolbar">
          <div class="groups" role="group" aria-label="Grupos de proyectos"><button class="group-button active" type="button" data-home-group="all" aria-pressed="true" onclick="setHomeGroup('all')">Proyectos</button><button class="group-button" type="button" data-home-group="recent" aria-pressed="false" onclick="setHomeGroup('recent')">Recientes</button><button class="group-button" type="button" data-home-group="starred" aria-pressed="false" onclick="setHomeGroup('starred')">Destacados</button></div>
          <span class="toolbar-spacer"></span>
          <div class="collection-actions"><div class="view-toggle" role="group" aria-label="Vista de proyectos"><button type="button" class="mode-list active" aria-label="Lista" aria-pressed="true" onclick="setViewMode('list')">☰</button><button type="button" class="mode-gallery" aria-label="Galería" aria-pressed="false" onclick="setViewMode('gallery')">▦</button></div><div class="create-wrap"><button class="create-button" type="button" aria-label="Crear proyecto" aria-expanded="false" onclick="toggleCreateMenu(this)">+</button><div class="create-menu" hidden><button type="button" onclick="toggleCreateMenu(this.parentElement.previousElementSibling)">Nuevo proyecto</button></div></div></div>
        </div>
        <table class="table"><thead><tr><th>Nombre</th><th>Descripción</th><th>Diagramas</th><th>Última actividad</th></tr></thead><tbody id="project-rows"></tbody></table>
        <div class="project-gallery" id="project-gallery" aria-label="Proyectos en galería"></div>
      </section>

      <section id="library" class="view library" aria-label="Biblioteca de recursos">
        <div class="collection-toolbar">
          <div class="groups" role="group" aria-label="Grupos de recursos"><button class="group-button active" type="button" data-resource-group="all" aria-pressed="true" onclick="setResourceGroup('all')">Todos</button><button class="group-button" type="button" data-resource-group="document" aria-pressed="false" onclick="setResourceGroup('document')">Documentos</button><button class="group-button" type="button" data-resource-group="note" aria-pressed="false" onclick="setResourceGroup('note')">Notas</button><button class="group-button" type="button" data-resource-group="media" aria-pressed="false" onclick="setResourceGroup('media')">Multimedia</button><button class="group-button" type="button" data-resource-group="link" aria-pressed="false" onclick="setResourceGroup('link')">Enlaces</button></div>
          <span class="toolbar-spacer"></span>
          <label class="search-field"><span aria-hidden="true">⌕</span><input id="library-search-input" type="search" placeholder="Buscar recursos" aria-label="Buscar recursos" oninput="renderResources()"></label>
          <div class="collection-actions"><div class="view-toggle" role="group" aria-label="Vista de recursos"><button type="button" class="mode-list" aria-label="Lista" aria-pressed="false" onclick="setViewMode('list')">☰</button><button type="button" class="mode-gallery active" aria-label="Galería" aria-pressed="true" onclick="setViewMode('gallery')">▦</button></div><div class="create-wrap"><button class="create-button" type="button" aria-label="Añadir recurso" aria-expanded="false" onclick="toggleCreateMenu(this)">+</button><div class="create-menu" hidden><button type="button" onclick="toggleCreateMenu(this.parentElement.previousElementSibling)">Subir archivo</button><button type="button" onclick="toggleCreateMenu(this.parentElement.previousElementSibling)">Crear nota</button><button type="button" onclick="toggleCreateMenu(this.parentElement.previousElementSibling)">Añadir enlace</button></div></div></div>
        </div>
        <p class="sort" id="resource-count">Nombre ↑</p>
        <div class="resource-grid" id="resource-grid"></div><div class="resource-list" id="resource-list"></div>
      </section>
    </main>
  </div>
  <script>
    const projects = [
      {title:'Atlas de campo',description:'Relaciones entre especies y lugares',diagrams:4,activity:'Hoy',starred:true},
      {title:'Historia oral',description:'Entrevistas, fotografías y notas',diagrams:2,activity:'Ayer',starred:false}
    ];
    const resources = [
      {type:'PDF',group:'document',icon:'',title:'Informe de humedales.pdf',preview:'<div class="paper-content"><strong>Informe de humedales</strong><i></i><i></i><i></i><i></i></div>',kind:'paper'},
      {type:'MAP',group:'document',icon:'note',title:'Mapa de relaciones',preview:'<div class="diagram-content"><span class="diagram-line"></span></div>',kind:'diagram'},
      {type:'NOTA',group:'note',icon:'note',title:'Observaciones de campo',preview:'<div class="note-preview"><strong>Observaciones</strong>El cauce conecta tres zonas con vegetación distinta.</div>',kind:'note-thumb'},
      {type:'IMG',group:'media',icon:'image',title:'Fotografía del estuario.jpg',preview:'◇',kind:'link-thumb'},
      {type:'LINK',group:'link',icon:'link',title:'Artículo de referencia',preview:'↗',kind:'link-thumb'},
      {type:'AUDIO',group:'media',icon:'audio',title:'Entrevista de campo.mp3',preview:'♫',kind:'audio-thumb'},
      {type:'VIDEO',group:'media',icon:'video',title:'Recorrido del estuario.mp4',preview:'▶',kind:'video-thumb'}
    ];
    const modes = {projects:'list',library:'gallery'};
    let homeGroup = 'all';
    let resourceGroup = 'all';
    const currentView = () => document.querySelector('.view.active').id;
    const resourceCard = item => `<button class="resource-card" type="button" aria-label="Abrir ${item.title}"><span class="resource-head"><span class="file-icon ${item.icon}">${item.type}</span><span class="title">${item.title}</span></span><div class="thumb ${item.kind}">${item.preview}</div></button>`;

    function renderProjects(){
      const shown = homeGroup === 'starred' ? projects.filter(item => item.starred) : projects;
      document.getElementById('project-rows').innerHTML = shown.map(item => `<tr><td class="item-name"><span class="item-icon">⌂</span>${item.title}</td><td class="muted">${item.description}</td><td>${item.diagrams}</td><td class="muted">${item.activity}</td></tr>`).join('');
      document.getElementById('project-gallery').innerHTML = shown.map(item => `<article class="project-tile"><strong>${item.title}</strong><p>${item.description}</p><small>${item.diagrams} diagramas · ${item.activity}</small></article>`).join('');
    }
    function renderResources(){
      const query = document.getElementById('library-search-input').value.trim().toLocaleLowerCase('es');
      const shown = resources.filter(item => (resourceGroup === 'all' || item.group === resourceGroup) && item.title.toLocaleLowerCase('es').includes(query));
      document.getElementById('resource-count').textContent = `${shown.length} recursos · Nombre ↑`;
      const content = shown.length ? shown.map(resourceCard).join('') : '<p class="empty">No hay recursos con estos filtros.</p>';
      document.getElementById('resource-grid').innerHTML = content;
      document.getElementById('resource-list').innerHTML = content;
      if (currentView() === 'library') document.getElementById('topbar-meta').textContent = `${shown.length} recursos`;
    }
    function syncViewMode(){
      document.getElementById('projects').classList.toggle('gallery', modes.projects === 'gallery');
      document.getElementById('library').classList.toggle('list', modes.library === 'list');
      document.querySelectorAll('.view').forEach(view => {
        view.querySelectorAll('.mode-list').forEach(button => {button.classList.toggle('active', modes[view.id] === 'list');button.setAttribute('aria-pressed', String(modes[view.id] === 'list'));});
        view.querySelectorAll('.mode-gallery').forEach(button => {button.classList.toggle('active', modes[view.id] === 'gallery');button.setAttribute('aria-pressed', String(modes[view.id] === 'gallery'));});
      });
    }
    function showView(name){
      document.querySelectorAll('.view').forEach(view => view.classList.toggle('active', view.id === name));
      document.getElementById('nav-projects').classList.toggle('active', name === 'projects');
      document.getElementById('nav-library').classList.toggle('active', name === 'library');
      document.getElementById('topbar-page').textContent = name === 'projects' ? 'Inicio' : 'Biblioteca';
      document.getElementById('topbar-meta').textContent = name === 'projects' ? 'Editado hoy' : document.getElementById('resource-count').textContent.split(' ·')[0];
      document.getElementById('app').classList.remove('sidebar-open');
      document.querySelectorAll('.create-menu').forEach(menu => {menu.hidden = true;menu.previousElementSibling.setAttribute('aria-expanded','false');});
      syncViewMode();
    }
    function setViewMode(mode){modes[currentView()] = mode;syncViewMode();}
    function setHomeGroup(group){homeGroup = group;document.querySelectorAll('[data-home-group]').forEach(button => {const active = button.dataset.homeGroup === group;button.classList.toggle('active', active);button.setAttribute('aria-pressed', String(active));});renderProjects();}
    function setResourceGroup(group){resourceGroup = group;document.querySelectorAll('[data-resource-group]').forEach(button => {const active = button.dataset.resourceGroup === group;button.classList.toggle('active', active);button.setAttribute('aria-pressed', String(active));});renderResources();}
    function toggleCreateMenu(button){const menu = button.nextElementSibling;const opening = menu.hidden;document.querySelectorAll('.create-menu').forEach(other => {other.hidden = true;other.previousElementSibling.setAttribute('aria-expanded','false');});menu.hidden = !opening;button.setAttribute('aria-expanded', String(opening));}
    document.addEventListener('keydown', event => {if (event.key === 'Escape') document.querySelectorAll('.create-menu').forEach(menu => {if (!menu.hidden){menu.hidden = true;menu.previousElementSibling.setAttribute('aria-expanded','false');menu.previousElementSibling.focus();}});});
    renderProjects();renderResources();syncViewMode();
  </script>
</body>
</html>
